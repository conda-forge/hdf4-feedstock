{% set version = "4.2.15" %}

package:
  name: hdf4
  version: {{ version }}

source:
  url: https://support.hdfgroup.org/ftp/HDF/releases/HDF{{ version }}/src/hdf-{{ version }}.tar.bz2
  sha256: bde035ef5a1cd5fdbd0a7f1fa5c17e98bbd599300189ac4d234f16e9bb7bcb12
  patches:
    - patches/max_files.patch
    - patches/debian/64bit.patch
    - patches/debian/hdf-4.2.10-aarch64.patch
    - patches/debian/hdfi.h.patch
    - patches/debian/spelling-errors.patch
    - patches/file-c-unistd.patch  # access() undeclared: error under GCC 14+/clang 16+
    - patches/lp64-aarch64-ppc64.patch  # nclong size: aarch64/ppc64 missing from 64-bit #if lists
    - patches/cmake-keep-autotools-abi.patch  # libdf.so.0 / libmfhdf.so.0, as autotools built them

build:
  number: 8
  run_exports:
    # change SONAMEs with bugfix rev.
    #    https://abi-laboratory.pro/tracker/timeline/hdf5/
    - {{ pin_subpackage('hdf4', max_pin='x.x.x') }}

requirements:
  build:
    - cmake
    - ninja
    - bison       # [not win]
    - flex        # [not win]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}  # [not win]
  host:
    - zlib
    - libjpeg-turbo

test:
  files:
    - sdrt.f90
  requires:
    - {{ compiler('fortran') }}  # [not win]
  commands:
    - hdiff -V  # [not win]
    - h4_ncgen -V  # [not win]
    - h4_ncdump -V  # [not win]
    - test -f ${PREFIX}/lib/libdf.a  # [not win]
    - test -f ${PREFIX}/lib/libmfhdf.a  # [not win]
    - test -f ${PREFIX}/lib/libdf${SHLIB_EXT}  # [not win]
    - test -f ${PREFIX}/lib/libmfhdf${SHLIB_EXT}  # [not win]
    # Same sonames as the autotools builds, so existing downstream binaries load.
    - test -f ${PREFIX}/lib/libdf.so.0  # [linux]
    - test -f ${PREFIX}/lib/libmfhdf.so.0  # [linux]
    - test -f ${PREFIX}/lib/libdf.0.dylib  # [osx]
    - test -f ${PREFIX}/lib/libmfhdf.0.dylib  # [osx]
    # Fortran interface (the point of this build): free-form include + libraries.
    - test -f ${PREFIX}/include/hdf.f90  # [not win]
    - test -f ${PREFIX}/lib/libhdf_fortran${SHLIB_EXT}  # [not win]
    - test -f ${PREFIX}/lib/libmfhdf_fortran${SHLIB_EXT}  # [not win]
    # Write and read back an SDS and attribute through the Fortran SD API.
    - ${FC} -I${PREFIX}/include sdrt.f90 -L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib -lmfhdf_fortran -lhdf_fortran -lmfhdf_fcstub -lhdf_fcstub -lmfhdf -ldf -o sdrt  # [not win]
    - ./sdrt  # [not win]

about:
  home: http://www.hdfgroup.org/HDF4/
  license: BSD-3-Clause
  summary: 'Library and multi-object file format for storing and managing data between machines'
  license_family: BSD
  license_file: COPYING
  doc_url: https://support.hdfgroup.org/release4/doc/index.html
  dev_url: https://github.com/HDFGroup/hdf4

extra:
  recipe-maintainers:
    - groutr
    - msarahan
    - ocefpaf
    - matthiasdiener
